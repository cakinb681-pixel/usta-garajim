<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Usta Garajım</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:white;padding:20px}
header h1{margin:0;font-size:24px}
nav{display:flex;overflow:auto;gap:7px;background:white;padding:10px;position:sticky;top:0;z-index:5}
nav button{border:0;border-radius:10px;padding:10px 14px;white-space:nowrap;font-weight:bold}
nav button.active{background:#111827;color:white}
main{max-width:900px;margin:auto;padding:15px}
.page{display:none}.page.active{display:block}
.card{background:white;border:1px solid #ddd;border-radius:15px;padding:15px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{font-size:28px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;margin:5px 0 10px;border:1px solid #ccc;border-radius:10px;font-size:16px}
textarea{min-height:80px}
.btn{background:#111827;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:bold}
.del{background:#fee2e2;color:#991b1b;border:0;border-radius:8px;padding:7px}
.muted{color:#6b7280;font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
img{max-width:100%;max-height:220px;object-fit:contain}
</style>
</head>

<body>

<header>
<h1>🔧 Usta Garajım</h1>
<small>Servis • Traktör • Parça • Stok</small>
</header>

<nav>
<button class="active" onclick="sayfa('ana',this)">Ana Sayfa</button>
<button onclick="sayfa('musteri',this)">Müşteriler</button>
<button onclick="sayfa('traktor',this)">Traktörler</button>
<button onclick="sayfa('servis',this)">Servis</button>
<button onclick="sayfa('parca',this)">Parçalar</button>
<button onclick="sayfa('stok',this)">Stok</button>
</nav>

<main>

<section id="ana" class="page active">
<h2>Ana Sayfa</h2>

<div class="grid">
<div class="card">Müşteri<div class="stat" id="mSay">0</div></div>
<div class="card">Traktör<div class="stat" id="tSay">0</div></div>
<div class="card">Servis<div class="stat" id="sSay">0</div></div>
<div class="card">Parça<div class="stat" id="pSay">0</div></div>
</div>

<div class="card">
<h3>Son Servisler</h3>
<div id="son"></div>
</div>
</section>

<section id="musteri" class="page">
<h2>Müşteriler</h2>

<div class="card">
<input id="mn" placeholder="Müşteri / Firma adı">
<input id="mt" placeholder="Telefon">
<textarea id="mnot" placeholder="Not"></textarea>
<button class="btn" onclick="musteriEkle()">Müşteri Kaydet</button>
</div>

<div id="mListe"></div>
</section>

<section id="traktor" class="page">
<h2>Traktörler</h2>

<div class="card">
<select id="tm"></select>
<input id="tmodel" placeholder="Marka / Model">
<input id="tseri" placeholder="Şase / Plaka / Seri No">
<input id="tsaat" placeholder="Çalışma saati">
<textarea id="tnot" placeholder="Traktör notu"></textarea>
<button class="btn" onclick="traktorEkle()">Traktör Kaydet</button>
</div>

<div id="tListe"></div>
</section>

<section id="servis" class="page">
<h2>Servis Kaydı</h2>

<div class="card">
<select id="st"></select>
<input id="starih" type="date">
<input id="sAriza" placeholder="Arıza / Şikayet">
<textarea id="sYapilan" placeholder="Yapılan işlem"></textarea>
<textarea id="sParca" placeholder="Kullanılan parçalar / OEM numaraları"></textarea>
<input id="sSaat" placeholder="Çalışma saati / Km">
<textarea id="sNot" placeholder="Ek not"></textarea>
<button class="btn" onclick="servisEkle()">Servis Kaydet</button>
</div>

<div id="sListe"></div>
</section>

<section id="parca" class="page">
<h2>Parça Kataloğu</h2>

<div class="card">
<input id="pno" placeholder="OEM / Parça Numarası">
<input id="padi" placeholder="Parça Adı">
<input id="pmarka" placeholder="Marka">
<input id="pmodel" placeholder="Uyumlu Model">
<input id="pfoto" type="file" accept="image/*">
<button class="btn" onclick="parcaEkle()">Parça Kaydet</button>
</div>

<div id="pListe"></div>
</section>

<section id="stok" class="page">
<h2>Stok</h2>

<div class="card">
<input id="stokno" placeholder="Parça numarası">
<select id="stoktip">
<option value="giris">Stok Girişi</option>
<option value="cikis">Stok Çıkışı</option>
</select>
<input id="stokadet" type="number" placeholder="Adet">
<button class="btn" onclick="stokEkle()">Kaydet</button>
</div>

<div id="stokListe"></div>
</section>

</main>

<script>

let db=JSON.parse(localStorage.getItem("ustaGarajim")||"null")||{
musteriler:[],
traktorler:[],
servisler:[],
parcalar:[],
stok:[]
};

function kaydet(){
localStorage.setItem("ustaGarajim",JSON.stringify(db));
goster();
}

function sayfa(id,buton){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
document.getElementById(id).classList.add("active");
buton.classList.add("active");
goster();
}

function temiz(id){
document.getElementById(id).value="";
}

function musteriEkle(){
let ad=mn.value.trim();
if(!ad)return alert("Müşteri adı yaz.");
db.musteriler.push({
id:Date.now(),
ad,
tel:mt.value,
not:mnot.value
});
temiz("mn");temiz("mt");temiz("mnot");
kaydet();
}

function traktorEkle(){
if(!tm.value||!tmodel.value)return alert("Müşteri ve model gerekli.");

db.traktorler.push({
id:Date.now(),
musteri:tm.value,
model:tmodel.value,
seri:tseri.value,
saat:tsaat.value,
not:tnot.value
});

["tmodel","tseri","tsaat","tnot"].forEach(temiz);
kaydet();
}

function servisEkle(){
if(!st.value||!sYapilan.value)return alert("Traktör ve yapılan işlem gerekli.");

db.servisler.push({
id:Date.now(),
traktor:st.value,
tarih:starih.value||new Date().toISOString().slice(0,10),
ariza:sAriza.value,
yapilan:sYapilan.value,
parca:sParca.value,
saat:sSaat.value,
not:sNot.value
});

["sAriza","sYapilan","sParca","sSaat","sNot"].forEach(temiz);
kaydet();
}

function parcaEkle(){
if(!pno.value||!padi.value)return alert("Parça numarası ve adı gerekli.");

let f=pfoto.files[0];

function ekle(resim){
db.parcalar.push({
id:Date.now(),
no:pno.value,
adi:padi.value,
marka:pmarka.value,
model:pmodel.value,
foto:resim||""
});

["pno","padi","pmarka","pmodel"].forEach(temiz);
pfoto.value="";
kaydet();
}

if(f){
let r=new FileReader();
r.onload=()=>ekle(r.result);
r.readAsDataURL(f);
}else ekle("");
}

function stokEkle(){
if(!stokno.value||!stokadet.value)return alert("Parça ve adet gerekli.");

db.stok.push({
id:Date.now(),
no:stokno.value,
tip:stoktip.value,
adet:Number(stokadet.value)
});

temiz("stokno");temiz("stokadet");
kaydet();
}

function sil(tablo,id){
if(confirm("Bu kayıt silinsin mi?")){
db[tablo]=db[tablo].filter(x=>x.id!=id);
kaydet();
}
}

function goster(){

mSay.textContent=db.musteriler.length;
tSay.textContent=db.traktorler.length;
sSay.textContent=db.servisler.length;
pSay.textContent=db.parcalar.length;

tm.innerHTML='<option value="">Müşteri seç</option>'+
db.musteriler.map(x=>`<option value="${x.ad}">${x.ad}</option>`).join("");

st.innerHTML='<option value="">Traktör seç</option>'+
db.traktorler.map(x=>`<option value="${x.id}">${x.model} - ${x.musteri}</option>`).join("");

mListe.innerHTML=db.musteriler.map(x=>`
<div class="card">
<div class="row"><b>${x.ad}</b>
<button class="del" onclick="sil('musteriler',${x.id})">Sil</button></div>
<div>${x.tel}</div>
<div class="muted">${x.not}</div>
</div>`).join("")||"<p class='muted'>Henüz müşteri yok.</p>";

tListe.innerHTML=db.traktorler.map(x=>`
<div class="card">
<div class="row"><b>${x.model}</b>
<button class="del" onclick="sil('traktorler',${x.id})">Sil</button></div>
<div>${x.musteri}</div>
<div class="muted">${x.seri} • ${x.saat}</div>
<p>${x.not}</p>
<h4>Servis Geçmişi</h4>
${db.servisler.filter(s=>s.traktor==x.id).map(s=>`
<div class="card">
<b>${s.tarih}</b><br>
Arıza: ${s.ariza}<br>
Yapılan: ${s.yapilan}<br>
Parçalar: ${s.parca}
</div>`).join("")||"<span class='muted'>Servis kaydı yok.</span>"}
</div>`).join("")||"<p class='muted'>Henüz traktör yok.</p>";

sListe.innerHTML=db.servisler.slice().reverse().map(s=>{
let t=db.traktorler.find(x=>x.id==s.traktor);
return `
<div class="card">
<div class="row"><b>${t?t.model:"Silinmiş traktör"}</b>
<button class="del" onclick="sil('servisler',${s.id})">Sil</button></div>
<div class="muted">${s.tarih} • ${t?t.musteri:""}</div>
<p><b>Arıza:</b> ${s.ariza}</p>
<p><b>Yapılan:</b> ${s.yapilan}</p>
<p><b>Parçalar:</b> ${s.parca}</p>
<p>${s.saat} ${s.not}</p>
</div>`;
}).join("")||"<p class='muted'>Henüz servis kaydı yok.</p>";

pListe.innerHTML=db.parcalar.map(p=>`
<div class="card">
${p.foto?`<img src="${p.foto}">`:""}
<div class="row"><b>${p.adi}</b>
<button class="del" onclick="sil('parcalar',${p.id})">Sil</button></div>
<p><b>OEM:</b> ${p.no}</p>
<p>${p.marka} • ${p.model}</p>
</div>`).join("")||"<p class='muted'>Henüz parça yok.</p>";

let stok={};
db.stok.forEach(x=>{
stok[x.no]=(stok[x.no]||0)+(x.tip=="giris"?x.adet:-x.adet);
});

stokListe.innerHTML=Object.entries(stok).map(([no,adet])=>`
<div class="card">
<div class="row"><b>${no}</b><b>${adet} adet</b></div>
</div>`).join("")||"<p class='muted'>Stok hareketi yok.</p>";

son.innerHTML=db.servisler.slice(-5).reverse().map(s=>
`<div class="card">${s.tarih} — ${s.yapilan}</div>`
).join("")||"<p class='muted'>Henüz servis yok.</p>";
}

goster();

</script>
</body>
</html>
